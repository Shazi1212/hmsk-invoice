# Apache settings for the invoice container
ServerTokens Prod
ServerSignature Off
PassEnv INVOICE_DATA_DIR

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>

# never serve dotfiles or a local config.php
<FilesMatch "^(\.|config\.php$)">
    Require all denied
</FilesMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "same-origin"
